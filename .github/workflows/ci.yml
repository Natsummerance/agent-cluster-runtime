# agent-cluster-runtime 持续集成（设计 §14，决策 D22/D23/D24）
#
# 触发：push（main 及 PR 分支）+ pull_request，不按路径豁免（全量门槛）。
# 分支保护口径：PR 合并要求 backend-test + frontend-test + e2e-real 全绿（与「每任务门槛」一致）。
#
# job 拆分：
#   backend-test  —— uv sync --frozen + 全量 pytest（15min 超时）
#   frontend-test —— npm ci + build(tsc+vite) + Vitest + i18n:check
#   e2e-real      —— 真实后端（deterministic）Playwright 套件；serve 由本 job 后台拉起，finally 强制 kill
#   package       —— 仅 tag v*：四平台打包矩阵；GITHUB_TOKEN 显式置空（决策 D24：防 electron-builder
#                    推断 publish provider），打包不发布；产物 upload-artifact
#   release       —— 仅 tag v*，needs package：patch-update-metadata 注入 minimumVersion/unsigned 后
#                    经 gh CLI 上传安装包与 latest*.yml（Release Notes 由 tag 生成）
on:
  push:
    branches:
      - main
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_call:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: uv.lock
      - name: Configure git identity (worktree initial commit)
        run: |
          git config --global user.name CI
          git config --global user.email ci@users.noreply.github.com
      - name: Sync backend deps (frozen)
        run: uv sync --frozen
      - name: Add venv bin to PATH (sandbox-less run_tests nested pytest)
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Backend test suite
        run: uv run pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Frontend build (tsc + vite)
        run: cd frontend && npm run build
      - name: Frontend unit tests (Vitest)
        run: cd frontend && npm test
      - name: i18n key parity check
        run: cd frontend && npm run i18n:check

  e2e-real:
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: uv.lock
      - name: Configure git identity (worktree initial commit)
        run: |
          git config --global user.name CI
          git config --global user.email ci@users.noreply.github.com
      - name: Sync backend deps (frozen)
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Real-backend e2e suite (deterministic)
        run: |
          set -euo pipefail
          # 后台拉起真实后端（& + $! 记录 PID）
          uv run agent-cluster serve --port 8765 --auth-token ci &
          SERVER_PID=$!
          # finally: 强制 kill serve 进程（顺带验证 13.5 无孤儿修复）
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -f "agent-cluster serve --port 8765" 2>/dev/null || true
          }
          trap cleanup EXIT
          cd frontend
          # 等真实后端就绪再启动 playwright（其 URL 探测是单次检查，冷启动竞态曾致端口冲突）
          for ((i=1; i<=90; i++)); do
            if curl -sf http://127.0.0.1:8765/api/v1/status >/dev/null 2>&1; then
              echo "backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/v1/status >/dev/null 2>&1 || { echo "backend not ready in 90s"; exit 1; }
          npm run e2e:real

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    env:
      # 决策 D24：置空防 electron-builder 推断 publish provider，打包不发布（发布走 release job）
      GITHUB_TOKEN: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64-arm64
            build: npx electron-builder --win nsis --x64 --arm64 --publish never
          - os: macos-14
            platform: macos
            arch: arm64
            build: npx electron-builder --mac --arm64 --publish never
          - os: macos-14
            platform: macos
            arch: x64
            build: npx electron-builder --mac --x64 --publish never
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build: npx electron-builder --linux deb --x64 --publish never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop deps
        run: cd desktop && npm ci
      - name: Mark unsigned artifacts (macOS, no signing cert this round)
        if: runner.os == 'macOS'
        run: echo "UPDATER_SUFFIX=-unsigned" >> "$GITHUB_ENV"
      - name: Package installers (${{ matrix.platform }} / ${{ matrix.arch }})
        working-directory: desktop
        run: ${{ matrix.build }}
      - name: Upload artifacts (installers only, not unpacked dirs)
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Inject update metadata (minimumVersion / unsigned)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node desktop/scripts/patch-update-metadata.js --out-dir metadata "$VERSION" $(find artifacts -name 'latest*.yml')
      - name: Drop unpatched latest*.yml from artifacts (metadata/ is authoritative)
        run: find artifacts -name 'latest*.yml' -delete
      - name: Normalize Windows asset names (match latest.yml urls)
        shell: bash
        run: |
          for f in artifacts/package-win-x64-arm64/*; do
            case "$(basename "$f")" in
              *\ * )
                mv "$f" "$(dirname "$f")/$(basename "$f" | tr ' ' '-')" ;;
            esac
          done
      - name: Publish GitHub Release (gh CLI, replaces flaky action-gh-release metadata PATCH)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # 清掉同 tag 旧 release（重跑/失败残留），保留 tag 本身
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          # 资产：artifacts/**（安装包，latest*.yml 已在上一步删除）+ metadata/**（补丁版 latest*.yml）
          mapfile -t ASSETS < <(find artifacts metadata -type f | sort)
          echo "uploading ${#ASSETS[@]} assets"
          gh release create "$TAG" --title "$TAG" --generate-notes "${ASSETS[@]}"