# electron-builder 配置（桌面工作台 v0.6.1：Windows NSIS x64+arm64 / macOS dmg+zip arm64+x64 / Linux deb x64）
appId: com.natsummerance.agent-cluster
productName: AgentClusterWorkbench
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - updater.js
  - package.json
  - dist-frontend/**
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName} Setup ${version} ${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  # 架构由 CLI --arm64/--x64 决定（矩阵两 job 各打各的；曾因在此固定双架构导致两 job 产物相同、release 上传同名 422）
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}${env.UPDATER_SUFFIX}.${ext}
linux:
  target:
    - target: deb
      arch:
        - x64
  category: Development
  maintainer: Natsummerance
  artifactName: ${productName}-${version}-${arch}.${ext}
afterSign: notarize.cjs
afterAllArtifactBuild: notarize.cjs
publish:
  - provider: github
    owner: natsummerance
    repo: agent-cluster-runtime