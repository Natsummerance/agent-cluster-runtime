<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="agent-cluster-runtime logo">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0%" stop-color="#1B2C4F"/>
      <stop offset="48%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0A101F"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.34" r="0.95">
      <stop offset="0%" stop-color="#FFE3A1"/>
      <stop offset="42%" stop-color="#FFC24B"/>
      <stop offset="100%" stop-color="#E3961F"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD66B" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#FFD66B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="satC" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0%" stop-color="#8CF0FF"/>
      <stop offset="55%" stop-color="#35D6F4"/>
      <stop offset="100%" stop-color="#1598BD"/>
    </radialGradient>
    <radialGradient id="satV" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0%" stop-color="#C0B4FF"/>
      <stop offset="55%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#5443C9"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#35D6F4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#35D6F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 晶格点阵 -->
  <g fill="#C7D3E3">
    <circle cx="64" cy="64" r="3" opacity="0.10"/><circle cx="192" cy="64" r="3" opacity="0.10"/>
    <circle cx="832" cy="64" r="3" opacity="0.10"/><circle cx="960" cy="64" r="3" opacity="0.10"/>
    <circle cx="64" cy="192" r="3" opacity="0.10"/><circle cx="960" cy="192" r="3" opacity="0.10"/>
    <circle cx="64" cy="832" r="3" opacity="0.10"/><circle cx="960" cy="832" r="3" opacity="0.10"/>
    <circle cx="64" cy="960" r="3" opacity="0.10"/><circle cx="192" cy="960" r="3" opacity="0.10"/>
    <circle cx="832" cy="960" r="3" opacity="0.10"/><circle cx="960" cy="960" r="3" opacity="0.10"/>
  </g>

  <!-- 轨道环 -->
  <circle cx="512" cy="512" r="392" fill="none" stroke="#35D6F4" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="512" cy="512" r="296" fill="none" stroke="#8B7CF6" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="3 10"/>
  <circle cx="512" cy="512" r="204" fill="none" stroke="#35D6F4" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 8"/>

  <!-- 核心光晕与核心 -->
  <circle cx="512" cy="512" r="330" fill="url(#coreGlow)"/>
  <circle cx="512" cy="512" r="128" fill="url(#core)"/>
  <circle cx="512" cy="512" r="128" fill="none" stroke="#FFE3A1" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="512" cy="512" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="480" cy="482" r="34" fill="#FFFFFF" fill-opacity="0.30"/>

  <!-- 卫星节点与连接线（6 岗位角色：决策/管理/执行三层 × 2） -->
  <g stroke="#9FB4D8" stroke-opacity="0.35" stroke-width="2.5">
    <line x1="512" y1="512" x2="808" y2="512"/>
    <line x1="512" y1="512" x2="660" y2="768"/>
    <line x1="512" y1="512" x2="364" y2="768"/>
    <line x1="512" y1="512" x2="216" y2="512"/>
    <line x1="512" y1="512" x2="364" y2="256"/>
    <line x1="512" y1="512" x2="660" y2="256"/>
  </g>

  <circle cx="808" cy="512" r="46" fill="url(#glowC)"/>
  <circle cx="808" cy="512" r="30" fill="url(#satC)"/>
  <circle cx="808" cy="512" r="30" fill="none" stroke="#BFF3FF" stroke-opacity="0.6" stroke-width="2.5"/>

  <circle cx="660" cy="768" r="46" fill="url(#glowV)"/>
  <circle cx="660" cy="768" r="30" fill="url(#satV)"/>
  <circle cx="660" cy="768" r="30" fill="none" stroke="#D8D0FF" stroke-opacity="0.6" stroke-width="2.5"/>

  <circle cx="364" cy="768" r="46" fill="url(#glowC)"/>
  <circle cx="364" cy="768" r="30" fill="url(#satC)"/>
  <circle cx="364" cy="768" r="30" fill="none" stroke="#BFF3FF" stroke-opacity="0.6" stroke-width="2.5"/>

  <circle cx="216" cy="512" r="46" fill="url(#glowV)"/>
  <circle cx="216" cy="512" r="30" fill="url(#satV)"/>
  <circle cx="216" cy="512" r="30" fill="none" stroke="#D8D0FF" stroke-opacity="0.6" stroke-width="2.5"/>

  <circle cx="364" cy="256" r="46" fill="url(#glowC)"/>
  <circle cx="364" cy="256" r="30" fill="url(#satC)"/>
  <circle cx="364" cy="256" r="30" fill="none" stroke="#BFF3FF" stroke-opacity="0.6" stroke-width="2.5"/>

  <circle cx="660" cy="256" r="46" fill="url(#glowV)"/>
  <circle cx="660" cy="256" r="30" fill="url(#satV)"/>
  <circle cx="660" cy="256" r="30" fill="none" stroke="#D8D0FF" stroke-opacity="0.6" stroke-width="2.5"/>

  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>