schema_version: "1.0"
machines:
  - name: plugin-fiber
    initial: declared
    terminal: [disposed]
    states: [declared, validating, shadow-starting, active, draining, failed, disposed]
    transitions:
      declared: [validating, disposed]
      validating: [shadow-starting, failed]
      shadow-starting: [active, failed]
      active: [draining, failed]
      draining: [disposed, failed]
      failed: [declared, disposed]
      disposed: []
  - name: organization-run
    initial: requested
    terminal: [completed, cancelled, failed]
    states:
      [requested, clarifying, planning, awaiting-approval, executing, verifying,
       releasing, retrospective, suspended, cancelling, completed, cancelled, failed]
    transitions:
      requested: [clarifying, cancelling, failed]
      clarifying: [planning, suspended, cancelling, failed]
      planning: [awaiting-approval, suspended, cancelling, failed]
      awaiting-approval: [executing, cancelling, failed]
      executing: [verifying, suspended, cancelling, failed]
      verifying: [executing, releasing, suspended, cancelling, failed]
      releasing: [retrospective, suspended, cancelling, failed]
      retrospective: [completed, suspended, cancelling, failed]
      suspended: [clarifying, planning, awaiting-approval, executing, verifying, releasing, retrospective, cancelling, failed]
      cancelling: [cancelled, failed]
      completed: []
      cancelled: []
      failed: []
